server {
    listen 80;
    server_name bigpapagames.com www.bigpapagames.com;
    client_max_body_size 1m;

    location /.well-known/acme-challenge/ {
        root /var/www/bigpapagames-acme;
    }

    location / {
        return 301 https://bigpapagames.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.bigpapagames.com;
    ssl_certificate /etc/letsencrypt/live/bigpapagames.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigpapagames.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://bigpapagames.com$request_uri;
}

server {
    listen 443 ssl;
    server_name bigpapagames.com;
    ssl_certificate /etc/letsencrypt/live/bigpapagames.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigpapagames.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
